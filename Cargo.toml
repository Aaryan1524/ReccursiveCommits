[workspace]
members = [
    "crates/cli",
    "crates/core",
    "crates/daemon",
    "crates/protocol",
    "crates/store",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/Aaryan1524/ReccursiveCommits"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
correctness = "deny"

